org: scoobies
service: playlist-backend
frameworkVersion: "4"

provider:
  name: aws
  stage: prod
  region: ap-south-1
  runtime: nodejs24.x

  httpApi:
    cors: true

  environment:
    TABLE_NAME: playlist-backend-data-table
    CURRENT_AWS_REGION: ${self:provider.region}
    BUCKET_NAME: playlist-backend-assets-bucket
    CLOUDFRONT_DOMAIN: ${env:CLOUDFRONT_DOMAIN, ""}

  iam: ${file(aws/iam.yaml)}

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node24

plugins:
  - serverless-offline

functions:
  storageApi:
    handler: src/storage/handlers/handler.handler
    events:
      - httpApi:
          path: /storage
          method: ANY
      - httpApi:
          path: /storage/{proxy+}
          method: ANY

  tracksApi:
    handler: src/tracks/handlers/handler.handler
    events:
      - httpApi:
          path: /tracks
          method: ANY
      - httpApi:
          path: /tracks/{proxy+}
          method: ANY

resources: ${file(aws/resources.yaml)}
